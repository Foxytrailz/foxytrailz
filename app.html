<!DOCTYPE html>
<html>
<head>
  <title>Foxy Animation App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    #screen {
      position: relative;
      width: 100%;
      height: 100vh;
      background: linear-gradient(45deg, #ff2a2a, #000);
    }

    .text {
      position: absolute;
      top: 40%;
      width: 100%;
      text-align: center;
      font-size: 40px;
      color: white;
      opacity: 0;
      animation: fadeIn 2s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(-20px); }
    }

    button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div id="screen">
  <div id="text" class="text">FoxyTrailz</div>
</div>

<button onclick="play()">▶ Play Animation</button>

<script>
function play() {
  const text = document.getElementById("text");
  text.style.animation = "none";
  text.offsetHeight;
  text.style.animation = "fadeIn 2s forwards";
}
</script>

</body>
</html>
